    progress: 42
    color: coral
    summary: Lecture 5 校准后衔接 Lecture 6 和 Build GPT；Tokenizer 与 CS336 A1 联动学习。
    next: 先解释 tanh 初始化问题并做最小实验，再进入 Lecture 6。
  - id: cs336
    title: Stanford CS336
    label: 半马前争取启动
    progress: 0
    color: violet
    summary: 先切入 L1 与 A1 tokenizer，再随作业补齐课程；不再把 GPT-2 完整复现作为 tokenizer 部分的前置条件。
    next: 9.16–18 争取完成第一讲和一个 tokenizer 实现切片；正式开始时固定版本。
  - id: algorithms
    title: Algorithms with Python
    label: 每日小练习
    progress: 4
    color: blue
    summary: 先做数组与哈希表诊断，保持约 25 分钟的基础练习，主要时间留给主线。
    next: 从一道起点题了解编码熟练度，不一次增加整套题单。
  - id: rag-eval
    title: RAG & Evaluation
    label: 暂缓 · 国庆后再议
    progress: 20
    color: green
    summary: 已有 Agent 实习接触过 RAG 与评测，量化项目尚未启动。国庆前不作为重点。
    next: 先完成当前课程阶段，再讨论是否安排公开安全的量化案例。
  - id: vla
    title: VLA & Embodied AI
    label: 保留探索
    progress: 3
    color: amber
    summary: 保留论文与演示的轻量入口。两台各一张 A100 的可用条件尚待确认。
    next: 选题和正式复现待确认资源及主线节奏后再安排。
phases:
  - period: 2026.09.08 — 09.18
    title: Karpathy 补桥，切入 CS336
    focus: L5 校准、L6、Build GPT；争取 L1 和 A1 tokenizer 的可验证切片。
  - period: 2026.09.19 — 09.29（暂定）
    title: 半马与休息
    focus: 不安排学习任务，不积累延期事项；暂按 9.30 恢复。
  - period: 2026.09.30 — 10.08
    title: 国庆在校，集中推进 A1
    focus: Tokenizer 收口，结合 L2/L3 实现模型、optimizer、训练循环；穿插 State of GPT。
  - period: 2026.10.09 — 10.18
    title: A1 收口与 GPT-2 124M
    focus: 争取完成 A1 核心测试和小规模训练报告；复现 GPT-2，明确与官方训练规模的差异。
  - period: 2026.10.19 — 11.08
    title: Systems 与 Scaling
    focus: 集中推进 A2、A3 与对应课程；GPU 和训练 API 限制明确登记。
  - period: 2026.11.09 — 12.06
    title: Data 与 Alignment
    focus: 集中推进 A4、A5，完成核心实现和缩小算力实验；按 A1 实际用时每周校准日期。
  - period: 2026.12 — 2027
    title: 查漏补缺，转化研究与求职成果
    focus: 目标是尽早完成五个作业的自学版本，再深化项目、研究与实习准备。以上日期是进取目标，不代表已完成或官方满规模验收。
