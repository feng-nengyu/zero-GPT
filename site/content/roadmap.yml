sprint:
  title: 本周 Karpathy 收尾，下周 CS336 做起来
  capacity: 9.8–13 共 27 小时（周二至周六每天 5h，周日 2h）；9.14–18 共 25 小时。若当天剩余时间不足，按真实进度调整，不补造学习时长。
  rhythm: 完整学习日：主线 4h20m、算法 25m、记录 15m；周日：主线 100m、算法 10m、记录 10m。每天另留 1h 锻炼。
  target: 9.13 前收完 L6、Build GPT、Tokenizer、GPT-2 与 State of GPT 的课程并完成最小实践；9.18 前争取完成 CS336 L1–L3 与 A1 tokenizer，进入模型部分。
  checkpoints:
    - period: 9.8–9.10
      title: L6 → Build GPT → Tokenizer
      result: L5 校准、WaveNet shape、小 GPT 训练采样、基础 BPE roundtrip；每天都有本人代码或解释。
      stretch: 用固定小 batch overfit 检查训练链路，增加 tokenizer 边界例子。
    - period: 9.11–9.13
      title: GPT-2 → State of GPT → 收尾
      result: 收完视频，在已确认可用的 A100 上运行短训练，记录 loss、显存、吞吐与采样，周日检查关键缺口。
      stretch: 配置允许时跑 124M；完整质量复现单独记录数据量、步数和评测。
    - period: 9.14–9.18
      title: CS336 L1–L3 + A1 tokenizer
      result: 固定课程和作业版本；实现 BPE trainer、encode/decode/iterable，逐项跑 tokenizer 测试。
      stretch: tokenizer 达标后开始 A1 的基础模型组件；9.18 保存恢复点。
  fallback: 课程收尾与掌握验收分别记录。下周优先保住 tokenizer 的正确实现和测试；模型部分可放到国庆。实现超时按实际卡点缩小当日范围，休息期没有学习债。
