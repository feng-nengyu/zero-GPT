sprint:
  title: 半马前，先完成 CS336 的第一小块
  capacity: 9.8–9.18 按 9 个工作日 × 5 小时估算，共 45 小时；9.8 当天若余量不足，从首个检查点微调，不占用休息期。
  rhythm: 主线 4 小时 20 分钟 · 算法 25 分钟 · 记录 15 分钟；每天另留 1 小时锻炼。
  target: 争取完成 CS336 第 1 讲与 A1 tokenizer 的一个可验证切片；不等同于完成 A1。
  checkpoints:
    - period: 9.8–9.10
      title: L5 校准 → Lecture 6
      result: 回答初始化问题、本人运行实验并解释；完成 WaveNet 的关键代码与 tensor shape 检查。
      stretch: 能解释 reshape、embedding、BatchNorm 在实现中的位置。
    - period: 9.11、9.14–9.15
      title: Build GPT，先把小模型跑通
      result: 完成核心模块、训练与采样；检查 causal mask、关键 shape 和一次小数据过拟合。
      stretch: 对照实现定位一个 bug；GPT-2 124M 复现留到国庆衔接。
    - period: 9.16–9.18
      title: CS336 L1 + A1 tokenizer 切片
      result: 核对版本并固定 commit，学习 Overview / tokenization；自己实现基础 encode/decode，验证含中文的 roundtrip。
      stretch: 完成 BPE trainer 与更多 tokenizer 官方测试；有余力预习 L2 的 PyTorch 与资源估算。
  fallback: 若 Build GPT 编码超时，半马前保留 L1 与最小 tokenizer 切片，完整 BPE 和训练实验移到国庆；不通过加时挤占锻炼或休息。
break:
  start: 2026-09-19
  end: 2026-09-29
  resume: 2026-09-30
  tentative: true
  note: 按最新反馈暂排 9.19–29 左右休息，具体返校学习日可再调整；期间不积累学习债务。
tracks:
