phases:
  - period: 2026.09.08 — 09.13
    title: Karpathy 课程与最小实践收尾
    focus: L5 校准、L6、Build GPT、Tokenizer、GPT-2、State of GPT；A100 短训练与周日检查。
  - period: 2026.09.14 — 09.18
    title: CS336 L1–L3，重点推进 A1 tokenizer
    focus: 版本与环境、BPE trainer、encode/decode/iterable、测试与小语料实验；有余力进入模型。
  - period: 2026.09.19 — 09.29（暂定）
    title: 半马与休息
    focus: 不安排学习任务，不累计延期事项；暂定 9.30 恢复。
  - period: 2026.09.30 — 10.08
    title: 国庆在校，争取收口 A1
    focus: 补 L4；模型、optimizer、训练循环、checkpoint、完整测试与 A100 小规模训练报告。
  - period: 2026.10.09 — 10.25
    title: A2 · Systems
    focus: L5–L8、L10，基线测量、Triton attention、并行与显存优化，跨机能力按资源实测。
  - period: 2026.10.26 — 11.08
    title: A3 · Scaling
    focus: L9、L11，受控实验、曲线拟合、预测验证；官方 API 与本地替代规模分开记录。
  - period: 2026.11.09 — 11.22
    title: A4 · Data
    focus: L12–L14，数据处理与过滤去重、统一训练预算下的质量对照。
  - period: 2026.11.23 — 12.06
    title: A5 · Alignment 与课程收口
    focus: L15–L17，SFT / reasoning RL；补 guest lectures，整理五个作业证据。日期按实际用时每周校准。
