fragments:
  - id: qkv
    topic: Attention
    question: Q、K、V 可以先怎么理解？
    answer: Q 像当前要找的信息，K 用来匹配，V 是匹配后要汇总的内容。比喻只是入口；实际计算要看 QKᵀ 的分数、softmax 权重，以及对 V 的加权和。
    source: https://jalammar.github.io/illustrated-transformer/
    source_title: Jay Alammar · The Illustrated Transformer
  - id: small-batch
    topic: 训练与调试
    question: 正式训练前，为什么先尝试过拟合一个小 batch？
    answer: 如果连很少的样本都拟合不了，优先检查数据、标签、loss 和参数更新。这是缩小排错范围的手段；小 batch 拟合成功还不能证明模型能泛化。
    source: https://karpathy.github.io/2019/04/25/recipe/
    source_title: Andrej Karpathy · A Recipe for Training Neural Networks
  - id: bpe-merge
    topic: Tokenizer
    question: BPE 每一步到底合并什么？
    answer: 在当前切分和词频统计下，挑出频次最高的相邻 token 对，加入合并规则并更新切分。token 不一定是完整的词，训练出的合并规则也需要保存。
    source: https://huggingface.co/learn/llm-course/chapter6/5
    source_title: Hugging Face · Byte-Pair Encoding tokenization
  - id: vla-action
    topic: VLA
    question: VLA 的 Action 和聊天回复有什么不同？
    answer: VLA 需要把视觉观察和语言指令连接到机器人动作表示。看论文时除了模型规模，也要留意动作如何编码、控制什么机器人、在哪些任务上评测。
    source: https://openvla.github.io/
    source_title: OpenVLA · 官方项目页
