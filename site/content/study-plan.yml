curriculum:
  - id: a1
    title: Basics · 把语言模型完整搭起来
    lectures: L1–L4 · tokenization / PyTorch / architecture / attention
    period: 9.14–10.08
    budget: 约 55–70 小时主线预算
    summary: 下周主要完成 tokenizer。9.30 恢复后补 L4，继续模型、优化器和训练；争取国庆收口 A1。
    steps:
      - 下周：版本与环境 → byte/BPE trainer → encode/decode/iterable → tokenizer 正确性与性能测试。
      - 9.30–10.02：看 L4（预算 95 分钟），实现并测试 embedding、normalization、position、attention 与 block；以固定 handout 为准。
      - 10.03–10.05：实现数值稳定的 loss、optimizer、学习率计划、梯度裁剪、数据加载与 checkpoint；小 batch overfit。
      - 10.06–10.08：A100 小规模训练与采样，检查完整测试，记录配置、曲线和官方规模差异。
    finish: 核心组件与训练入口可测；有本人实现、训练曲线、采样、参数与显存估算，能解释一个失败案例。tokenizer 完成只是其中一部分。
    url: https://github.com/stanford-cs336/assignment1-basics
  - id: a2
    title: Systems · 找瓶颈，再做优化
    lectures: L5–L8、L10 · GPU / kernels / parallelism / inference
    period: 10.09–10.25
    budget: 约 45–60 小时主线预算
    summary: 从 A1 的实测基线出发，逐项改变实现并比较。单张 A100 可先做大部分单卡测量；跨机结果另记条件。
    steps:
      - 五讲各先留 95 分钟，边看边画 GPU 内存与计算路径；L10 为 inference 补充。
      - 给 A1 增加稳定的 benchmark 和 profiling，记录 warmup、同步、重复测量及峰值显存。
      - 按 handout 完成 Triton attention 与正确性检查，比较不同长度下的误差、速度、显存。
      - 实现作业要求的并行/内存优化；只有第二台机器与网络实测可用才开展跨机实验。
    finish: 至少一组优化前后可复现对照，包含正确性、测量方法、不同输入规模与适用范围；未做的多卡项明确列出。
    url: https://github.com/stanford-cs336/assignment2-systems
  - id: a3
    title: Scaling · 用实验分配算力
    lectures: L9、L11 · scaling laws
    period: 10.26–11.08
    budget: 约 25–35 小时主线预算
    summary: 先掌握实验设计与拟合，再讨论放大后的趋势。官方训练 API 是否能用，需要开始时确认。
    steps:
      - 两讲各留 95 分钟，写清模型参数、数据量、训练计算量和 loss 的关系。
      - 核对 handout 的实验/API 要求，确定可用预算与一组模型/数据规模；保留未参与拟合的验证点。
      - 跑受控 sweep，统一数据、随机种子与停止规则；资源不支持官方 API 时记录替代方案。
      - 拟合曲线并用未参与拟合的点验证，报告误差与外推范围。
    finish: 实验表、拟合代码、曲线与预测误差齐全；本地小规模替代实验和官方 API 要求分开记录。
    url: https://github.com/stanford-cs336/assignment3-scaling
  - id: a4
    title: Data · 从原始文本到训练语料
    lectures: L12–L14 · evaluation / sources / filtering
    period: 11.09–11.22
    budget: 约 45–60 小时主线预算
    summary: 这里的 evaluation 是课程中的模型和数据评估；近期暂缓的 RAG 项目不会插入本阶段。
    steps:
      - 三讲各留 95 分钟，先确定比较不同数据处理方案的指标与固定训练预算。
      - 用少量公开语料搭起抽取、语言与质量过滤、去重、tokenization 的完整链路。
      - 逐步加入过滤/去重规则，记录每一步保留率、示例与处理耗时。
      - 在同一训练配置下比较数据方案，报告数据规模、污染检查、验证结果与算力缩放差异。
    finish: 完整 pipeline 可复现，至少一组受控数据对照；保留率、训练配置和模型结果能对应起来。
    url: https://github.com/stanford-cs336/assignment4-data
  - id: a5
    title: Alignment · 从 SFT 到 reasoning RL
    lectures: L15–L17 · post-training / RLVR / multimodality
    period: 11.23–12.06
    budget: 约 45–65 小时主线预算
    summary: 先建立可评测的 SFT 基线，再做 reasoning RL。模型大小按 A100 实测选择，DPO 为可选扩展。
    steps:
      - 三讲各留 95 分钟，分清数据、监督信号、采样和奖励在训练中的位置。
      - 核对 handout，选适合显存的小模型与数据子集；先建立固定评测集和 SFT 基线。
      - 实现规定的 reasoning RL 训练部分，检查 reward、有效回答率、训练稳定性与评测变化。
      - 对照 SFT 与 RL 的结果，分析失败样本，整理五个作业的证据；有余力再选 DPO 扩展。
    finish: SFT/RL 对照、训练与评测配置、奖励检查、失败样本和规模差异齐全；不能只报告最好一次分数。
    url: https://github.com/stanford-cs336/assignment5-alignment
  - id: guests
    title: Guest lectures · 课程视野补全
    lectures: L18–L19 · Daniel Selsam / Dan Fu
    period: 课程收口时
    budget: 两讲各先留 95 分钟
    summary: 为课程完整性保留入口。开始时检查公开视频或材料的可用情况，缺失资源如实登记。
    steps:
      - 从 Spring 2026 官网核对两场 guest lecture 对应的公开材料。
      - 每次看完，只记录一个值得追问的问题和一个与已做作业的连接。
    finish: 可获取的课程材料已学习并有自己的简短解释；未公开或尚不可访问的录像不标完成。
    url: https://cs336.stanford.edu/
