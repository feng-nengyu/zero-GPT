weeks:
  - id: karpathy
    label: 本周 · Karpathy 收尾
    period: 9.8–9.13
    target: L6 → Build GPT → Tokenizer → GPT-2 → State of GPT；周日用自己的代码与解释收尾。
    note: 本周末继续学习：周六 5h、周日 2h 轻量收尾；每天另留 1h 锻炼。
  - id: cs336
    label: 下周 · CS336 主线
    period: 9.14–9.18
    target: 学习 L1–L3；重点完成 A1 tokenizer 与相关测试，周五开始模型组件。
    note: 优先保住 tokenizer 的可验证产物；模型部分是进度允许时的下一步。9.19–29 不安排学习。
days:
  - date: '2026-09-08'
    week: karpathy
    title: L5 校准 + L6 WaveNet
    outcome: 把 L5 的梯度问题讲明白，跑通 WaveNet 的 shape 与一次前后向。
    minutes: 300
    blocks:
      - id: l5-check
        kind: check
        minutes: 40
        title: 先补上 L5 的一个检查点
        task: 先独立回答页面下方的 tanh 问题，再运行初始化实验；把三种尺度的输出与解释发来。
        done: 能区分 tanh 局部导数和含权重连乘的跨层梯度；未解释清楚就保留待检查。
        sources:
          - tanh
          - l5
      - id: l6-watch
        kind: watch
        minutes: 70
        title: 看 L6 · WaveNet
        task: 观看全片 56 分钟，另留 14 分钟暂停；重点记 context 如何分组、reshape 前后维度。
        done: 写出至少一组 (B,T,C) 在层间变化的过程。
        sources:
          - l6
      - id: l6-code
        kind: code
        minutes: 110
        title: 自己敲出层级上下文模型
        task: 从已有 makemore 继续实现分组与网络；先小 batch 前后向，再短训练。代码卡住先缩小输入定位。
        done: 保存本人运行的 shape、loss 和一段采样；训练步数与配置写清楚。
        sources:
          - l6
      - id: l6-review
        kind: check
        minutes: 40
        title: 合上视频，检查实现
        task: 换一个 context size，定位需要修改的维度；剩余时间处理一个 bug 或回看刚才卡住的片段。
        done: 能指出 embedding、分组和输出层各自的输入输出。
        sources:
          - l6
      - id: algorithm
        kind: algorithm
        minutes: 25
        title: 数组与哈希表起点诊断
        task: 用 Python 判断列表是否存在重复元素，先写朴素版本，再尝试 set。
        done: 跑空列表、有重复、无重复三个例子；说出时间与空间复杂度。
        sources:
          - python
      - id: output
        kind: output
        minutes: 15
        title: 留下今天的进展
        task: 网站与节奏反馈已经记下；学习后再发一句理解、一个结果和一个卡点。
        done: 新增学习结果等本人反馈后写入；现有反馈记录不代表学习步骤完成。
        sources: []
    question:
      prompt: 在很多层的 tanh MLP 中，如果权重初始化得过大，前向激活和反向梯度分别会发生什么？为什么？
      sources:
        - l5
        - tanhdoc
        - tanh
  - date: '2026-09-09'
    week: karpathy
    title: Build GPT · 从 attention 到采样
    outcome: 把一个小型字符级 GPT 的训练与采样接起来。
    minutes: 300
    blocks:
      - id: gpt-watch
        kind: watch
        minutes: 140
        title: 看完 Build GPT
        task: 观看全片 116 分钟，留 24 分钟暂停；沿着 bigram → self-attention → block → GPT 跟踪结构。
        done: 在纸上标出 Q/K/V、causal mask、残差与输出 logits 的位置。
        sources:
          - gpt
      - id: gpt-code
        kind: code
        minutes: 90
        title: 完成最小训练与 generate
        task: 自己实现 attention 和 block；先用很小的层数与 batch 检查前后向，再运行短训练、生成文本。
        done: 记录 train/validation loss、训练步数和一段样本，不追求文本质量。
        sources:
          - gpt
      - id: gpt-check
        kind: check
        minutes: 30
        title: 检查 mask 和数据泄漏
        task: 对一个极小 batch 检查 attention 矩阵；尝试 overfit 固定小 batch，不能下降就留下定位记录。
        done: 未来位置权重为 0，logits 为 (B,T,V)，loss 与输入移位对应。
        sources:
          - gpt
      - id: algorithm
        kind: algorithm
        minutes: 25
        title: 哈希表 · 两数之和
        task: 先说明为什么需要记住之前的数，再写一个返回下标的函数。
        done: 用重复数字和无答案输入测试；解释 O(n) 时间。
        sources:
          - python
      - id: output
        kind: output
        minutes: 15
        title: 记录 GPT 的一条证据
        task: 发主要 tensor shape、一次 loss 记录和你最不确定的一个模块。
        done: 据实际结果形成短记录，不为了公开产出另写长文。
        sources: []
    question:
      prompt: 如果 causal mask 去掉，训练 loss 可能变好，为什么生成时却会出问题？
      sources:
        - gpt
  - date: '2026-09-10'
    week: karpathy
    title: Tokenizer · bytes → BPE
    outcome: 亲手做一个小 BPE，实现 encode/decode 的 roundtrip。
    minutes: 300
    blocks:
      - id: tok-watch
        kind: watch
        minutes: 150
        title: 看 GPT Tokenizer
        task: 观看全片 133 分钟，留 17 分钟暂停；区分 UTF-8 bytes、merge、词表与 special tokens。
        done: 手算一次最高频相邻 pair 的合并，写清新 token 代表哪些 bytes。
        sources:
          - tokenizer
      - id: tok-code
        kind: code
        minutes: 90
        title: 写一个小 BPE
        task: 用自己构造的小文本实现 pair 计数、merge 与基础 encode/decode；这是课程练习，A1 按 handout 再独立实现。
        done: 在英文、中文、emoji 三个字符串上验证 decode(encode(x)) == x。
        sources:
          - tokenizer
      - id: tok-check
        kind: check
        minutes: 20
        title: 检查边界并整理卡点
        task: 检查空串和重复文本；把基础版还没处理的 regex、special tokens 等差异写出来。
        done: 保留通过和失败的例子；不把基础版称作完整 GPT tokenizer。
        sources:
          - tokenizer
      - id: algorithm
        kind: algorithm
        minutes: 25
        title: 字典计数
        task: 统计序列中相邻 pair 的频率，构造频数相同的例子。
        done: 能解释字典键的设计、计数循环和相同频数的处理方式。
        sources:
          - python
      - id: output
        kind: output
        minutes: 15
        title: 记下 tokenizer 的边界
        task: 记录一个中文 roundtrip、一个失败例子，以及当前支持的能力。
        done: 把本周学习版与下周 A1 要求分开写。
        sources: []
    question:
      prompt: 为什么 byte-level tokenizer 能处理训练时没见过的字符，而按字符建词表可能需要 unknown token？
      sources:
        - tokenizer
  - date: '2026-09-11'
    week: karpathy
    title: GPT-2 124M · 结构与训练入口
    outcome: 读懂并搭起 GPT-2 的结构和最小训练入口。
    minutes: 300
    blocks:
      - id: gpt2-first
        kind: watch
        minutes: 135
        title: 看 GPT-2 视频前约 2 小时
        task: 从开头看到约 2:00:00，预留暂停；实际停下的时间点写入记录，第二天从那里继续。
        done: 记下模型定义、权重加载与训练效率相关的关键变化。
        sources:
          - gpt2
          - nano
      - id: gpt2-code
        kind: code
        minutes: 100
        title: 完成模型结构与 smoke test
        task: 按视频逐步实现关键模块，先用小配置检查前后向，再在手边 A100 上实例化 124M，核对参数量与显存。
        done: 保留自己运行的参数量、logits shape、一个训练 step 与运行设备。
        sources:
          - nano
      - id: gpt2-check
        kind: check
        minutes: 25
        title: 做一张训练配置卡
        task: 列出 batch、sequence length、层数、宽度、dtype 与数据；记录 A100 显存容量、驱动与 PyTorch/CUDA 是否可用。
        done: 明确小配置与 124M、完整训练之间的差异；列出一个待解的实现问题。
        sources:
          - nano
      - id: algorithm
        kind: algorithm
        minutes: 25
        title: 数组 · 双指针
        task: 写一个原地反转列表的函数，说明左右指针什么时候结束。
        done: 跑长度 0、1、奇数、偶数四种输入。
        sources:
          - python
      - id: output
        kind: output
        minutes: 15
        title: 记录 GPT-2 实践起点
        task: 发配置、运行结果与视频暂停时间点。
        done: 以本人运行记录为准，未训练的配置只标计划。
        sources: []
    question:
      prompt: 为什么 gradient accumulation 能增大有效 batch，却不等于把所有样本同时放进显存？
      sources:
        - gpt2
        - nano
  - date: '2026-09-12'
    week: karpathy
    title: GPT-2 下半程 + State of GPT
    outcome: 收完课程视频，理解训练工程与模型能力的连接。
    minutes: 300
    blocks:
      - id: gpt2-rest
        kind: watch
        minutes: 140
        title: 接着看完 GPT-2 视频
        task: 从昨天记录的位置继续看到结尾；暂停整理优化、验证和采样流程。若前一天没到 2 小时，优先保证本片看完。
        done: 把看懂的环节与还没亲手做的优化分开列出。
        sources:
          - gpt2
          - nano
      - id: state-watch
        kind: watch
        minutes: 50
        title: 看 State of GPT
        task: 预算 50 分钟观看与简记；这是 2023 年报告，用来建立 pretraining、SFT、RLHF 的流程图。
        done: 画出训练阶段关系，并说清 base model 与 assistant 的区别。
        sources:
          - state
      - id: gpt2-run
        kind: code
        minutes: 50
        title: 短训练并记录
        task: 在手边 A100 上先跑小配置，再尝试 124M 的短训练；warmup 后记录 loss、峰值显存、tokens/s 与采样，按实测调整 batch。
        done: 留下 A100 型号/显存、参数量、步数、dtype、loss、显存、吞吐与采样；短训练不算完整质量复现。
        sources:
          - nano
      - id: gpt2-review
        kind: check
        minutes: 20
        title: 留一个明天要解决的问题
        task: 检查训练记录是否可复现，把最阻碍理解的一个问题带到周日。
        done: 明确自己完成了什么、尚缺哪项证据。
        sources:
          - gpt2
      - id: algorithm
        kind: algorithm
        minutes: 25
        title: 复习一次哈希题
        task: 不看昨天代码，重写两数之和或重复元素检测，选择较不熟的一道。
        done: 自己构造边界输入，若卡住先说明思路。
        sources:
          - python
      - id: output
        kind: output
        minutes: 15
        title: 汇总一张课程完成清单
        task: 列出 L6、Build GPT、Tokenizer、GPT-2、State of GPT 的观看与实践状态。
        done: 只按真实完成更新，不从日期或勾选推断掌握。
        sources: []
    question:
      prompt: 一个只训练 next-token prediction 的 base model，为什么不能直接等同于一个可靠的聊天助手？
      sources:
        - state
