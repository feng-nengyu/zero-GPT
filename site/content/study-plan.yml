timing_note: 下列分钟数是包含暂停、笔记与动手的学习预算，不是录像净时长。L6 / Build GPT / Tokenizer 的官方时长分别为 56 / 116 / 133 分钟；GPT-2 与 State of GPT 按分段观看预算安排。CS336 每讲先留 95 分钟，实际录像时长和版本在开学当日复核。 CS336 以官网当前录像列表为主入口；已核对的 2025 L2/L3 直达录像仅作备用，使用时记录与本次讲义的差异。
boundary: 本周目标是收完剩余课程、做出最小可运行实现；已确认一张 A100 可用；GPT-2 完整训练另记数据和步数。看完、实践完成、已掌握分别记录。用时超出就保留卡点并重新排期，不挤占每天 1 小时锻炼或 9.19–29 的休息。
