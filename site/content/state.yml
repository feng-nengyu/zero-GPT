question:
  title: Lecture 5 · 概念检查 01
  prompt: 在很多层的 tanh MLP 中，如果权重初始化得过大，前向激活和反向梯度分别会发生什么？为什么？
  references:
    - title: Karpathy · Activations & Gradients, BatchNorm
      url: https://youtu.be/P6sfmUTpUmc
      hint: 官方 Lecture 4；找 tanh 饱和与激活、梯度统计的部分，先观察图像。
    - title: Karpathy · Becoming a Backprop Ninja
      url: https://youtu.be/q8SA3rM6ckI
      hint: 官方 Lecture 5；关注 tanh 与线性层的手写反向传播。
    - title: PyTorch · Tanh
      url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Tanh.html
      hint: 看定义、曲线和输入输出；再回想局部导数与跨层梯度有什么区别。
    - title: 最小实验 · tanh 初始化尺度
      url: https://github.com/feng-nengyu/zero-GPT/blob/main/exercises/karpathy/tanh_init_check.py
      hint: 概念想过后，运行并解释饱和率、局部导数与梯度统计。助手试跑不算你的实践。
